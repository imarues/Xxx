name: Build Xxx IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Select stable Xcode
        run: |
          set -euo pipefail
          SELECTED=$(ls -d /Applications/Xcode*.app | grep -v -Ei 'beta|rc' | sort -V | tail -1)
          sudo xcode-select -s "$SELECTED/Contents/Developer"
          xcodebuild -version

      - name: Verify rich sss source
        run: |
          set -euo pipefail
          test -f TurathSource/project.yml
          test -f TurathSource/StoreReplica/App.swift
          test -f TurathSource/StoreReplica/Views/SigningHubView.swift
          test -f TurathSource/StoreReplica/Views/DownloadsCenterView.swift
          test -f TurathSource/StoreReplica/Views/SearchFastView.swift
          test -f TurathSource/StoreReplica/Views/AppCloneSheet.swift
          test -f TurathSource/StoreReplica/Views/AppDylibMergeSheet.swift
          test -f TurathSource/StoreReplica/Core/DetailPreparationCenter.swift
          test -f TurathSource/StoreReplica/Core/SideloadSigningCore.swift
          test -f TurathSource/StoreReplica/BatSignCore/BatSignSigner.swift
          test -f TurathSource/Vendor/Zsign/Package.swift
          test -f Integration/HiddenBatSignRuntime.swift
          test -f scripts/prepare-rich-turath-batsign.py
          test -f scripts/verify-rich-batsign-routing.sh
          echo "Enhanced sss signing-hub source verified."

      - name: Wire rich sss tools to BatSign backend
        run: |
          set -euo pipefail
          bash scripts/build-rich-sss.sh
          grep -F 'HiddenBatSignRuntime.shared.bootstrap()' TurathSource/StoreReplica/App.swift
          grep -F 'BatSignSigner.sign' TurathSource/StoreReplica/BatSignCore/BatSignPackagePipeline.swift
          grep -F 'BatSignSigner.inject' TurathSource/StoreReplica/Core/SideloadSigningCore.swift
          echo "Visible UI stays sss; signing, clone finalization and dylib injection are routed through BatSignCore."

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Turath project
        working-directory: TurathSource
        run: xcodegen generate

      - name: Build unsigned device app
        working-directory: TurathSource
        run: |
          set -o pipefail
          xcodebuild \
            -project TurathReplica.xcodeproj \
            -scheme TurathReplica \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="TurathSource/build/Build/Products/Release-iphoneos/TurathReplica.app"
          rm -rf Payload packages
          mkdir -p Payload packages
          cp -R "$APP" Payload/
          zip -qry packages/Xxx.ipa Payload
          ls -lh packages/Xxx.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Xxx-rich-sss-ipa
          path: packages/Xxx.ipa
          if-no-files-found: error
