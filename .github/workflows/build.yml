name: Build Xxx IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Select stable Xcode
        run: |
          set -euo pipefail
          SELECTED=$(ls -d /Applications/Xcode*.app | grep -v -Ei 'beta|rc' | sort -V | tail -1)
          sudo xcode-select -s "$SELECTED/Contents/Developer"
          xcodebuild -version

      - name: Verify real Xxx backend and rich sss UI
        run: |
          set -euo pipefail
          test -f Feather/FeatherApp.swift
          test -f Feather/Utilities/Handlers/SigningHandler.swift
          test -f Feather/Utilities/Handlers/AppFileHandler.swift
          test -f Feather/Utilities/Handlers/CertificateFileHandler.swift
          test -f Feather/Backend/Observable/AutoSignManager.swift
          test -f Feather/Backend/Observable/DownloadManager.swift
          test -f Feather/Backend/Storage/Storage+Certificate.swift
          test -f TurathSource/StoreReplica/Views/RootAndHome.swift
          test -f TurathSource/StoreReplica/Views/SigningHubView.swift
          test -f TurathSource/StoreReplica/Views/AppCloneSheet.swift
          test -f TurathSource/StoreReplica/Views/AppDylibMergeSheet.swift
          test -f Integration/XxxBatSignShellBridge.swift
          echo "Feather/BatSign backend + rich sss shell verified."

      - name: Mount sss UI on Xxx backend
        run: |
          set -euo pipefail
          python3 scripts/prepare-sss-shell-on-xxx.py
          test ! -d Feather/TurathShell/BatSignCore
          ! grep -R -n 'BatSignSigner\|Zsign\.injectDyLib\|Zsign\.sign(' Feather/TurathShell --include='*.swift' --exclude='XxxBatSignShellBridge.swift'
          grep -F 'RootStoreView()' Feather/FeatherApp.swift
          grep -F 'AutoSignManager.shared.enqueue' Feather/TurathShell/Core/XxxBatSignShellBridge.swift
          grep -F 'DownloadManager.shared.startDownload' Feather/TurathShell/Core/XxxBatSignShellBridge.swift
          grep -F 'Storage.shared.addCertificate' Feather/TurathShell/Core/XxxBatSignShellBridge.swift
          echo "SSS is UI only; real operations route to Xxx/Feather."

      - name: Build real Feather/BatSign target
        run: |
          set -o pipefail
          xcodebuild \
            -project Feather.xcodeproj \
            -scheme Feather \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          # Feather Release uses DEPLOYMENT_LOCATION and installs here.
          APP="_build/Applications/BatSign.app"
          test -d "$APP"
          test -f "$APP/Info.plist"
          BIN=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")
          test -s "$APP/$BIN"
          rm -rf Payload packages
          mkdir -p Payload packages
          cp -R "$APP" Payload/
          zip -qry packages/Xxx.ipa Payload
          echo "Packaged real target: $APP"
          ls -lh packages/Xxx.ipa

      - name: Audit built binary
        run: |
          set -euo pipefail
          APP=$(find Payload -maxdepth 1 -type d -name '*.app' | head -1)
          BIN=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")
          strings "$APP/$BIN" > /tmp/xxx-strings.txt
          grep -F 'XxxBatSignBridge' /tmp/xxx-strings.txt
          grep -F 'SigningHandler' /tmp/xxx-strings.txt
          grep -F 'AutoSignManager' /tmp/xxx-strings.txt
          grep -F 'RootStoreView' /tmp/xxx-strings.txt
          echo "Built IPA contains sss shell and native Xxx signing runtime."

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Xxx-sss-ui-real-batsign
          path: packages/Xxx.ipa
          if-no-files-found: error
